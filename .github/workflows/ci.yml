name: CI

# Runs only when the code changes, so a change to the docs does not start a build.
on:
  pull_request:
    paths: ['RPM.Android/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['RPM.Android/**', '.github/workflows/ci.yml']

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going for the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: rpm-android
      # The Cast tests read cast/receiver.html from the rpm repo, checked out next to this one.
      - uses: actions/checkout@v7
        with:
          repository: rpmrpmrpm/rpm
          path: rpm
          # A private repo can only be checked out with the organisation secret SIBLING_REPOS_TOKEN,
          # a token that can read the rpm repos. A public repo needs no secret.
          token: ${{ secrets.SIBLING_REPOS_TOKEN || github.token }}
      # The icon fonts. Without them (a pull request from a fork gets no secrets) the build uses the
      # free fonts in core/iconfonts-free.
      - uses: actions/checkout@v7
        continue-on-error: true
        with:
          repository: rpmrpmrpm/rpm-fonts-pro
          path: rpm-fonts-pro
          token: ${{ secrets.SIBLING_REPOS_TOKEN }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test :phone:assembleDebug :tv:assembleDebug
        working-directory: rpm-android/RPM.Android
